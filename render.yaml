# Blueprint de Render para el backend de SIRX.
# Al conectar este repo en Render ("New +" → "Blueprint"), este archivo
# crea el Web Service automáticamente con el build/start/migraciones
# correctos — ver docs/DEPLOYMENT.md para el resto de variables (DATABASE_URL,
# CORS_ORIGIN, ADMIN_PASSWORD, OPERADOR_PASSWORD) que Render pide llenar a mano.
# JWT_SECRET lo genera Render solo.
services:
  - type: web
    name: sirx-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npx prisma generate
    # Aplica migraciones (prisma migrate deploy), crea roles/usuarios iniciales
    # (seed idempotente) y arranca la API. Render no da shell en el plan gratis,
    # por eso el seed corre aquí.
    startCommand: npm run start:render
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 30m
      - key: MAX_LOGIN_ATTEMPTS
        value: 3
      - key: LOCKOUT_MINUTES
        value: 15
      - key: CORS_ORIGIN
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: OPERADOR_PASSWORD
        sync: false
